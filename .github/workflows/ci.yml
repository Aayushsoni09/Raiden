name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint runbooks
        run: python scripts/lint_runbooks.py runbooks/
      - name: Validate catalog schema
        run: python scripts/validate_catalog.py catalog/_schema.yaml catalog/example-project.yaml catalog/example-project-aws.yaml
      - name: Unit and integration tests
        run: pytest tests/ -v
      - name: Security scan
        run: bandit -r src/ -ll
