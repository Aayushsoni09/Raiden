id: restart_ecs_service
description: >
  Force a new ECS service deployment, cycling all running tasks to fresh
  instances. Non-destructive: does not change desired count or task
  definition revision.

params:
  type: object
  required: [cluster, service, region]
  properties:
    cluster: { type: string }
    service: { type: string }
    region: { type: string }

command:
  - aws
  - ecs
  - update-service
  - --cluster
  - "{cluster}"
  - --service
  - "{service}"
  - --force-new-deployment
  - --region
  - "{region}"

confirm_message: >
  Force a new deployment of ECS service '{service}' in cluster '{cluster}' ({region})?

requires_confirmation: true
