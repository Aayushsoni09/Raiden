id: restart_cloud_run
description: >
  Force a new revision rollout of a Cloud Run service to restart its instances.
  Non-destructive: does not change traffic split or delete any revision.

params:
  type: object
  required: [service, region, project_id]
  properties:
    service: { type: string }
    region: { type: string }
    project_id: { type: string }

# Executor renders this template with schema-validated params only. No
# free-form shell input is ever accepted here.
command:
  - gcloud
  - run
  - services
  - update
  - "{service}"
  - --region={region}
  - --project={project_id}
  - --no-traffic

confirm_message: >
  Restart Cloud Run service '{service}' in region '{region}'?

requires_confirmation: true
